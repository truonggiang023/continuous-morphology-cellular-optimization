[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-morphology-cellular-optimization"
version = "0.1.0"
description = "Configurable FEM–ML–SHAP–NSGA-II research pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "scikit-learn>=1.3", "shap>=0.45", "pymoo>=0.6,<0.7", "joblib>=1.3", "scipy>=1.10", "matplotlib>=3.8", "xgboost>=2,<4", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cmco = "cmco.pipeline:main"
cmco-doe = "cmco.study:main"
cmco-postprocess = "cmco.mechanics:main"
cmco-import-workbook = "cmco.workbook:main"

[tool.setuptools.packages.find]
include = ["cmco*"]
